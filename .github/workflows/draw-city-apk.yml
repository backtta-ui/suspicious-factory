name: DRAW CITY Android APK
on:
  push:
    branches: [draw-city-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download the exact APK and verify it
        shell: bash
        run: |
          set -euo pipefail
          mkdir verified
          base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}"
          curl --fail --silent --show-error --location --retry 3 "$base/DRAW-CITY-0.1.0.apk" --output verified/DRAW-CITY-0.1.0.apk
          curl --fail --silent --show-error --location --retry 3 "$base/SHA256SUMS.txt" --output verified/SHA256SUMS.txt
          cd verified
          sha256sum --check SHA256SUMS.txt
          unzip -tq DRAW-CITY-0.1.0.apk
      - name: Provide the verified APK through Actions
        uses: actions/upload-artifact@v4
        with:
          name: draw-city-verified-apk
          path: verified/
          retention-days: 14
          if-no-files-found: error
